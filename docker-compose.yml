# docker-compose.yml
# Примечание: поле `version` удалено — оно устарело в Docker Compose v2.
# Compose v2 определяет синтаксис автоматически без него.

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_DB:       residenze
      POSTGRES_USER:     residenze
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Init scripts (only on FIRST container start, when data dir empty):
      # создаём platform/zamoskv databases для multi-tenant.  В prod
      # запускается один раз при initial deployment; на CI каждый run.
      - ./ops/db-init/:/docker-entrypoint-initdb.d/:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U residenze"]
      interval: 10s
      timeout: 5s
      retries: 5
    # SEC [AUDIT #13]: внутренний network — БД недоступна напрямую ни frontend'у,
    # ни (случайно прокинутыми) host portforward'ами.  Только backend и backup
    # могут её видеть по docker DNS.
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"

  # ── Redis (SSE pub/sub + idempotency cache + token revocation) ────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    # FIX [AUDIT]: добавлен пароль для Redis.
    # Без пароля любой процесс в docker-сети (или при случайном проросе порта)
    # может читать/очищать кеш отозванных токенов — что обходит logout.
    # REDIS_PASSWORD задаётся в .env (не менее 32 символов).
    command: >
      redis-server
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # SEC [AUDIT #13]: Redis — только internal.  Session-revocation list,
    # rate-limit counters, SSE pub/sub не должны быть доступны frontend'у
    # напрямую (только через backend).
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"

  # ── Backend (Node.js API) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    mem_limit: 512m
    command: sh -c "node src/migrate.js && node src/index.js"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SEC [AUDIT #7]: env_file пробрасывает ВСЕ переменные из .env (PLATFORM_*,
    # ZAMOSKV_*, VAPID_*, SENTRY_DSN, REFRESH_LEGACY_*, SSE_MAX_CONNECTIONS,
    # SMSRU_FALLBACK_API_ID, CONTACT_EMAIL) без явного перечисления.  Явные
    # entries ниже перекрывают .env значения — это те, что зависят от compose-
    # scoped переменных (DB_PASSWORD, REDIS_PASSWORD и т.п.).
    env_file:
      - .env
    environment:
      DATABASE_URL:  postgresql://residenze:${DB_PASSWORD}@db:5432/residenze
      # SEC [AUDIT #7]: platform-v1 DSN-ы пересобираются из DB_PASSWORD, чтобы
      # пароль в .env хранился один раз.  Если ZAMOSKV_DB_URL / PLATFORM_DB_URL
      # заданы в .env напрямую — env_file выше уже их подхватит (эти строки
      # не применяются, если переменная отсутствует в .env).
      PLATFORM_DB_URL: ${PLATFORM_DB_URL:-postgresql://residenze:${DB_PASSWORD}@db:5432/platform}
      ZAMOSKV_DB_URL:  ${ZAMOSKV_DB_URL:-postgresql://residenze:${DB_PASSWORD}@db:5432/zamoskv}
      # FIX [AUDIT]: Redis URL теперь содержит пароль
      REDIS_URL:     redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET:    ${JWT_SECRET}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?PLATFORM_JWT_SECRET must be set}
      # Время жизни access token задаётся в backend/src/routes/auth.js
      # (ACCESS_TOKEN_EXPIRES = '15m'). JWT_EXPIRES здесь не используется — удалён.
      SMSRU_API_ID:  ${SMSRU_API_ID:-STUB}
      BACKEND_URL:   ${BACKEND_URL:-http://localhost:3001}
      UPLOAD_SIGNING_SECRET: ${UPLOAD_SIGNING_SECRET:?UPLOAD_SIGNING_SECRET must be set}
      PLATFORM_ALLOWED_HOSTNAME_SUFFIX: ${PLATFORM_ALLOWED_HOSTNAME_SUFFIX:-}
      PLATFORM_ALLOWED_HOSTNAMES: ${PLATFORM_ALLOWED_HOSTNAMES:-}
      # FIX [SEC-4]: FRONTEND_URL обязателен в production.
      # Сервер завершится с ошибкой если не задан при NODE_ENV=production.
      FRONTEND_URL:  ${FRONTEND_URL:?FRONTEND_URL must be set}
      PORT:          3001
      UPLOAD_DIR:    /app/uploads
      NODE_ENV:      ${NODE_ENV:-production}
    volumes:
      - uploads:/app/uploads
    # Порт 3001 НЕ пробрасывается наружу — backend доступен только через nginx.
    # Раскомментируйте только для локальной отладки:
    # ports:
    #   - "127.0.0.1:3001:3001"
    # FIX [AUDIT]: ротация логов — без неё при длительной работе диск переполняется.
    # pino пишет в stdout → Docker json-file driver. max-size 50m × 5 файлов = 250MB макс.
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    # SEC [AUDIT #13]: backend — bridge между internal (db/redis) и public
    # (frontend / исходящий internet для SMS/Telegram/web-push API).
    networks:
      - internal
      - public
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"

  # ── Frontend (React + nginx) ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_RUNTIME_MODE: live
        VITE_API_URL: ${BACKEND_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # FIX [AUDIT]: BACKEND_URL и YOUR_DOMAIN подставляются envsubst в nginx CSP-заголовок.
      # docker-entrypoint.sh читает эти переменные и генерирует nginx.conf из шаблона.
      BACKEND_URL: ${BACKEND_URL:?BACKEND_URL must be set}
      YOUR_DOMAIN: ${YOUR_DOMAIN:?YOUR_DOMAIN must be set}
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
    ports:
      - "80:80"
    # SEC [AUDIT #6]: HTTPS (443 + letsencrypt volumes) вынесены в
    # docker-compose.prod.yml overlay — запускать prod через:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
    # Раньше 443 и volumes были закомментированы inline, что в runbook'е
    # приводило к расхождению между "ENABLE_HTTPS=true" в .env и реальным
    # отсутствием binding'а — nginx слушал 80, certbot выдавал cert, но
    # HTTPS-запросы валились с Connection refused.
    # DO-04: nginx log rotation — без ограничений access.log при 1000 req/day = GB за неделю
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    # DO-04: healthcheck для frontend — проверяет что nginx отдаёт HTML
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ | grep -q '<html' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # SEC [AUDIT #13]: frontend только в public — не может достучаться до db
    # или redis (и не должен; proxies всё через backend).
    networks:
      - public
    deploy:
      resources:
        limits:
          cpus: "0.5"

  # ── Резервное копирование БД ──────────────────────────────────────────────────
  # FIX [AUDIT]: заменён sleep-цикл на настоящий cron через busybox crond.
  #
  # ПРОБЛЕМА с sleep: при рестарте контейнера в момент 23:58 следующий бэкап
  # будет через 24ч + время до рестарта. При сбое сервера в нужный момент —
  # данные за день могут потеряться.
  #
  # РЕШЕНИЕ: busybox crond (встроен в alpine) запускает задачу по расписанию
  # независимо от времени старта контейнера. При рестарте — следующий запуск
  # будет в ближайшее время по расписанию (03:00), не через 24ч.
  #
  # Расписание: каждый день в 03:00 UTC.
  # Ротация: хранятся последние 7 бэкапов (файлы старше 7 дней удаляются).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD}
      # SEC [AUDIT #5]: три БД бекапятся, не одна.  При добавлении нового
      # Empty by default: backup.sh discovers active tenant DBs from
      # platform.properties. Set BACKUP_DATABASES only as a manual override.
      BACKUP_DATABASES: ${BACKUP_DATABASES:-}
      PLATFORM_DB_URL: ${PLATFORM_DB_URL:-postgresql://residenze:${DB_PASSWORD}@db:5432/platform}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    # busybox crond: -f (foreground), -d 8 (log level: notice)
    # crontab передаётся через stdin — не нужен отдельный файл
    #
    # SEC [AUDIT #11]: bind-mount ./backups:/backups на новых инсталляциях
    # создаётся docker'ом как root:root 755 — pg_dump от root это устраивает,
    # но если оператор вручную создаёт директорию под другим UID (типичная
    # ошибка на первом deploy), backup.sh падает с "permission denied" и
    # инкремент тихо не создаётся.  Жёстко нормализуем при старте:
    #   - mkdir гарантирует наличие.
    #   - chmod 0700 — только root (owner контейнера) читает/пишет.  Бекапы
    #     содержат ВСЕ данные жильцов (phone, unit_id, packages, chat) —
    #     world-readable недопустимо.
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /backups
        chmod 0700 /backups
        # /backup.sh is mounted read-only and may come from a Windows checkout.
        # Normalize it inside the container before cron execution.
        tr -d '\r' < /backup.sh > /tmp/backup.sh
        chmod 0700 /tmp/backup.sh
        # Создаём crontab: 03:00 UTC каждый день
        echo "0 3 * * * sh /tmp/backup.sh >> /var/log/backup.log 2>&1" | crontab -
        echo "[backup] cron scheduled: daily at 03:00 UTC, BACKUP_DIR=/backups (0700)"
        # Запускаем crond в foreground
        exec crond -f -d 8
    # SEC [AUDIT #13]: backup видит только БД (internal), исходящий internet
    # ему не нужен.
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.25"

volumes:
  db_data:
  uploads:

# SEC [AUDIT #13]: две разделённые docker-сети.
#
# internal — db, redis, backup, backend (только backend-side).  Без
# `internal: true` оставляем, потому что backend сидит в обеих сетях и
# делает outbound (sms.ru, api.telegram.org, VAPID push endpoints).  Лишать
# всю internal сеть интернета нельзя — backend потеряет исходящие вызовы.
# Защита здесь — не фильтр egress, а недоступность db/redis для frontend:
# frontend не подключён к `internal` и физически не может открыть TCP на
# db:5432 или redis:6379.
#
# public — frontend + backend.  Через эту сеть идут только нужные
# HTTP-запросы frontend → backend.
networks:
  internal:
    driver: bridge
  public:
    driver: bridge

# ── HTTPS (SEC-3) ─────────────────────────────────────────────────────────────
# Перед production обязательно включить HTTPS:
#
#   1. Установить certbot:
#      docker run --rm -p 80:80 -v /etc/letsencrypt:/etc/letsencrypt \
#        certbot/certbot certonly --standalone -d yourdomain.com
#
#   2. Раскомментировать порт 443 в секции frontend
#
#   3. Убедиться что nginx.prod.conf.template монтируется в контейнер
#      (см. комментарии в frontend/nginx.prod.conf)

