<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 282 72" fill="none" role="img" aria-labelledby="logo02b-title">
  <title id="logo02b-title">DomHub — Wordmark with Mark B (dh ligature)</title>

  <!--
    Mark B: True "dh" ligature where the right post of "d" IS the left post of "h".
    The two letters share a single shared stem running full height.
    Left side = "d" bowl, right side = "h" arch + right leg.
    One continuous form, not two letterforms placed side by side.
    No gold accent — the structural elegance is the signal.
  -->

  <!-- ── MARK B: square container ── -->
  <rect x="0" y="8" width="56" height="56" rx="10" fill="#eee7dc"/>

  <!--
    Shared stem: x=28, runs from y=15 to y=51 (full height ascender).
    This is simultaneously the right post of "d" and the left post of "h".

    "d" side (left):
      - Left stem at x=15.2, y=22 to y=51
      - Bowl: from left stem at y=22 curves right to shared stem at y=22,
        arcs down through y=36.5 apex, returns at y=50

    "h" side (right):
      - Right leg at x=40.8, y=28 to y=51
      - Arch: from shared stem at y=22 curves right to right leg at y=28
  -->

  <!-- Shared center stem -->
  <line x1="28" y1="15" x2="28" y2="51" stroke="#11100e" stroke-width="2.4" stroke-linecap="butt"/>

  <!-- d left stem -->
  <line x1="15.2" y1="22" x2="15.2" y2="51" stroke="#11100e" stroke-width="2.4" stroke-linecap="butt"/>

  <!-- d bowl: left stem to shared stem -->
  <path d="M15.2,22 C15.2,20.5 20,18 25,21 C27.5,22.5 28,22 28,22"
        stroke="#11100e" stroke-width="2.0" stroke-linecap="butt" fill="none"/>
  <path d="M28,50 C28,50 27.5,51.5 22,51.5 C16.5,51.5 15.2,50 15.2,50"
        stroke="#11100e" stroke-width="2.0" stroke-linecap="butt" fill="none"/>
  <!-- d bowl right curve (the bulge) -->
  <path d="M15.2,22 C15.2,22 12.5,22 12,33 C11.5,44 15.2,50 15.2,50"
        stroke="#11100e" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

  <!-- h arch: from shared stem curves to right leg -->
  <path d="M28,24 C28,22 31,19.5 34.4,19.5 C37.8,19.5 40.8,22 40.8,25"
        stroke="#11100e" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

  <!-- h right leg -->
  <line x1="40.8" y1="25" x2="40.8" y2="51" stroke="#11100e" stroke-width="2.4" stroke-linecap="butt"/>

  <!-- ── WORDMARK (same construction as 02a/02c) ── -->
  <!-- d -->
  <line x1="73.2" y1="11" x2="73.2" y2="54" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>
  <path d="M73.2,23 C73.2,21.5 79,20 85.5,23.5 C92,27 92,50 85.5,53.5 C79,57 73.2,55.5 73.2,54"
        stroke="#eee7dc" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

  <!-- o -->
  <path d="M105,23 C110.8,23 114.5,28.5 114.5,38.5 C114.5,48.5 110.8,54 105,54
           C99.2,54 95.5,48.5 95.5,38.5 C95.5,28.5 99.2,23 105,23 Z"
        stroke="#eee7dc" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

  <!-- m -->
  <line x1="121.2" y1="23" x2="121.2" y2="54" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>
  <path d="M121.2,25 C121.2,23 123.5,19.5 126.3,19.5 C129.1,19.5 131.4,23 131.4,25"
        stroke="#eee7dc" stroke-width="2.0" stroke-linecap="butt" fill="none"/>
  <line x1="131.4" y1="25" x2="131.4" y2="54" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>
  <path d="M131.4,25 C131.4,23 133.7,19.5 136.8,19.5 C139.9,19.5 142.2,23 142.2,25"
        stroke="#eee7dc" stroke-width="2.0" stroke-linecap="butt" fill="none"/>
  <line x1="142.2" y1="25" x2="142.2" y2="54" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>

  <!-- h -->
  <line x1="150.6" y1="11" x2="150.6" y2="54" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>
  <path d="M150.6,26 C150.6,24 153,21 157.6,21 C162.2,21 164.6,24 164.6,26"
        stroke="#eee7dc" stroke-width="2.0" stroke-linecap="butt" fill="none"/>
  <line x1="164.6" y1="26" x2="164.6" y2="54" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>

  <!-- u -->
  <line x1="170.6" y1="23" x2="170.6" y2="44" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>
  <path d="M170.6,44 C170.6,55 173.5,56.5 178.6,56.5 C183.7,56.5 186.6,55 186.6,44"
        stroke="#eee7dc" stroke-width="2.0" stroke-linecap="butt" fill="none"/>
  <line x1="186.6" y1="23" x2="186.6" y2="54" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>

  <!-- b -->
  <line x1="192.6" y1="11" x2="192.6" y2="54" stroke="#eee7dc" stroke-width="2.4" stroke-linecap="butt"/>
  <path d="M192.6,23 C192.6,21.5 198.4,20 204.9,23.5 C211.4,27 211.4,50 204.9,53.5 C198.4,57 192.6,55.5 192.6,54"
        stroke="#eee7dc" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

</svg>
