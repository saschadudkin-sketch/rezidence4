<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <title>DomHub — O lockmark simplified, 16px favicon</title>

  <!--
    DomHub favicon 16px — further reduced lockmark.
    At 16px: the oculus ring + impost (0.4px hairline) renders as visual noise
    or disappears entirely depending on renderer and pixel grid.
    Decision: oculus detail removed entirely. Only the O silhouette remains —
    a clean warm-white oval on dark ground with open counter.
    The oval silhouette alone is distinctive enough at this size.
    The stroke contrast (thicker sides, thinner top/bottom) is preserved
    in the outer oval shape even without the inner detail.
  -->

  <!-- Background -->
  <rect width="16" height="16" rx="2" fill="#11100e"/>

  <!-- O outer oval — warm white, Didone-proportioned -->
  <path d="M 8 1.5
           C 11.3 1.5, 14 4.4, 14 8
           C 14 11.6, 11.3 14.5, 8 14.5
           C 4.7 14.5, 2 11.6, 2 8
           C 2 4.4, 4.7 1.5, 8 1.5 Z"
        fill="#eee7dc"/>

  <!-- O counter — dark, opens the letter -->
  <path d="M 8 4
           C 10.2 4, 12 5.8, 12 8
           C 12 10.2, 10.2 12, 8 12
           C 5.8 12, 4 10.2, 4 8
           C 4 5.8, 5.8 4, 8 4 Z"
        fill="#11100e"/>

</svg>
