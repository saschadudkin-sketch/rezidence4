<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" fill="none" role="img" aria-labelledby="markb-title">
  <title id="markb-title">DomHub Mark B — dh ligature sharing one stem</title>

  <!-- Square container -->
  <rect x="0" y="0" width="56" height="56" rx="10" fill="#eee7dc"/>

  <!--
    Shared center stem: x=28, y=7 to y=49.
    This serves as both the right post of "d" and the left post of "h".

    "d" left stem: x=14.5, y=14 to y=49
    "d" bowl top: from (14.5,14) curves right to (28,14) — joins shared stem
    "d" bowl bottom: from (28,49) curves left to (14.5,49)
    "d" bowl right bulge: from (14.5,14) down through (~11.5,31.5) to (14.5,49)
    [the bulge goes LEFT of the left stem for optical roundness]

    "h" arch: from (28,17) curves up through (34,13) to (41.5,18)
    "h" right leg: x=41.5, y=18 to y=49
  -->

  <!-- Shared stem -->
  <line x1="28" y1="7" x2="28" y2="49" stroke="#11100e" stroke-width="2.4" stroke-linecap="butt"/>

  <!-- d left stem -->
  <line x1="14.5" y1="14" x2="14.5" y2="49" stroke="#11100e" stroke-width="2.4" stroke-linecap="butt"/>

  <!-- d bowl: top connection left-to-shared -->
  <path d="M14.5,14 C14.5,12.5 19.5,11 24.5,13 C27,14 28,14 28,14"
        stroke="#11100e" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

  <!-- d bowl: bottom connection shared-to-left -->
  <path d="M28,49 C28,49 26,50.5 21.5,50.5 C17,50.5 14.5,49 14.5,49"
        stroke="#11100e" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

  <!-- d bowl: right-side bulge curve (the actual bowl roundness, going right of left stem) -->
  <path d="M14.5,14 C10.5,14 9,21 9,31.5 C9,42 10.5,49 14.5,49"
        stroke="#11100e" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

  <!-- h arch: from shared stem to right leg -->
  <path d="M28,19 C28,16.5 31,13.5 34.8,13.5 C38.6,13.5 41.5,16.5 41.5,20"
        stroke="#11100e" stroke-width="2.0" stroke-linecap="butt" fill="none"/>

  <!-- h right leg -->
  <line x1="41.5" y1="20" x2="41.5" y2="49" stroke="#11100e" stroke-width="2.4" stroke-linecap="butt"/>

</svg>
