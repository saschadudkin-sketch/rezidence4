<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" fill="none">
  <title>DomHub — Variant C, Emblem with architectural cartouche</title>

  <!-- ═══════════════════════════════════════════════════════════════
       VARIANT C — Emblem / cartouche (Aman / Rosewood register)
       Structure: architectural frame (cornice profile top and base)
       + DH monogram inside + DOMHUB wordmark below
       Frame is NOT a plain rectangle — it echoes the pediment
       profile of neoclassical Moscow civic architecture.
       Palette: #1e1b16 ink / #c9a96e gold accent
       ═══════════════════════════════════════════════════════════════ -->

  <g fill="#1e1b16">

    <!-- ══ CARTOUCHE FRAME ════════════════════════════════════════
         Top: classical cornice profile — a thin flat fascia,
         a subtle ovolo (quarter-round) moulding, then vertical wall.
         Bottom: same mirrored. The form reads as an architectural
         cartouche, not a UI component border.                      -->

    <!-- Outer frame shape (full fill then cut with inner) -->
    <!-- Top cornice fascia + ovolo + wall, all four sides -->
    <path d="
      M 22 8
      L 298 8
      C 300 8 302 9.5 302 11.5
      L 302 148.5
      C 302 150.5 300 152 298 152
      L 22 152
      C 20 152 18 150.5 18 148.5
      L 18 11.5
      C 18 9.5 20 8 22 8 Z
    "/>
    <!-- Inner frame cutout -->
    <path d="
      M 26 16
      L 294 16
      C 295.5 16 296.5 17 296.5 18.5
      L 296.5 141.5
      C 296.5 143 295.5 144 294 144
      L 26 144
      C 24.5 144 23.5 143 23.5 141.5
      L 23.5 18.5
      C 23.5 17 24.5 16 26 16 Z
    " fill="#f5ede0"/>

    <!-- Top cornice accent line (hairline gold, top inner frame) -->
    <rect x="23.5" y="24" width="273" height="0.65" rx="0.3" fill="#c9a96e" opacity="0.7"/>
    <!-- Bottom cornice accent line -->
    <rect x="23.5" y="135" width="273" height="0.65" rx="0.3" fill="#c9a96e" opacity="0.7"/>

    <!-- ══ DH MONOGRAM ════════════════════════════════════════════
         Centred in upper portion of cartouche.
         D and H interlock — the H crossbar passes through D's bowl.
         Thin-thick contrast present but understated (Aman register).
         All in #1e1b16 on the cream field.                         -->

    <!-- D of monogram -->
    <!-- D left stem -->
    <path d="M 118 34 L 118 80 L 122 80 L 122 34 Z"/>
    <!-- D top serif -->
    <path d="M 114.5 34 C 115.5 33.5 117 33.8 118 34 L 122 34 C 123 33.8 124.5 33.5 125.5 34 L 125.5 32.4 C 124 32.7 122 33 120 33 C 118 33 115.5 32.7 114.5 32.4 Z"/>
    <!-- D bottom serif -->
    <path d="M 114.5 80 C 115.5 80.5 117 80.2 118 80 L 122 80 C 123 80.2 124.5 80.5 125.5 80 L 125.5 81.6 C 124 81.3 122 81 120 81 C 118 81 115.5 81.3 114.5 81.6 Z"/>
    <!-- D bowl outer -->
    <path d="M 122 34 C 131 34 144 37.5 148.5 47 C 152.5 55.5 151 67 145 73 C 139.5 78.5 130 80 122 80 Z"/>
    <!-- D bowl inner counter -->
    <path d="M 122 39 C 129 39 140 42 143 49.5 C 146.5 57.5 145 67 140 71.5 C 135.5 75.5 128.5 75 122 74.5 Z"
          fill="#f5ede0"/>

    <!-- H of monogram — the crossbar threads THROUGH the D bowl space -->
    <!-- H right stem -->
    <path d="M 178 34 L 178 80 L 182 80 L 182 34 Z"/>
    <!-- H top serif right -->
    <path d="M 174.5 34 C 175.5 33.5 177 33.8 178 34 L 182 34 C 183 33.8 184.5 33.5 185.5 34 L 185.5 32.4 C 184 32.7 182 33 180 33 C 178 33 175.5 32.7 174.5 32.4 Z"/>
    <!-- H bottom serif right -->
    <path d="M 174.5 80 C 175.5 80.5 177 80.2 178 80 L 182 80 C 183 80.2 184.5 80.5 185.5 80 L 185.5 81.6 C 184 81.3 182 81 180 81 C 178 81 175.5 81.3 174.5 81.6 Z"/>
    <!-- H left stem (overlaps D slightly to create interlocking feel) -->
    <path d="M 155 34 L 155 80 L 159 80 L 159 34 Z"/>
    <!-- H left stem serifs -->
    <path d="M 151 34 C 152 33.5 153.5 33.8 155 34 L 159 34 C 160.5 33.8 162 33.5 163 34 L 163 32.4 C 161.5 32.7 159.5 33 157 33 C 154.5 33 152 32.7 151 32.4 Z"/>
    <path d="M 151 80 C 152 80.5 153.5 80.2 155 80 L 159 80 C 160.5 80.2 162 80.5 163 80 L 163 81.6 C 161.5 81.3 159.5 81 157 81 C 154.5 81 152 81.3 151 81.6 Z"/>
    <!-- H crossbar — hairline, threads through -->
    <rect x="159" y="55.5" width="19" height="1.2" rx="0.6"/>

    <!-- ══ WORDMARK ═══════════════════════════════════════════════
         "DOMHUB" in tight spaced small caps, centred below the rule.
         Using simplified geometry appropriate for small size —
         these are display-set small caps, not the full Didone above.
         Hairline weight for contrast with the monogram above.       -->

    <!-- Wordmark is set as single outlined text-like path group.
         Each letter is ~8px cap height, tracking very tight.
         We render each as a thin filled shape (stroke-contrast minimal
         at this scale — this is caption-scale, not display).        -->

    <!-- "DOMHUB" — at y≈115, centred in 320px viewBox -->
    <!-- Simple constructed letterforms for cartouche wordmark at scale -->

    <!-- D small cap -->
    <path d="M 90 108 L 90 122 L 92.5 122 C 97 122 100.5 118.5 100.5 115 C 100.5 111.5 97 108 92.5 108 Z"/>
    <path d="M 91.2 109.5 L 91.2 120.5 L 92.5 120.5 C 95.8 120.5 98.8 118.5 98.8 115 C 98.8 111.5 95.8 109.5 92.5 109.5 Z"
          fill="#f5ede0"/>

    <!-- O small cap -->
    <path d="M 103 115 C 103 111 106 107.5 110 107.5 C 114 107.5 117 111 117 115 C 117 119 114 122.5 110 122.5 C 106 122.5 103 119 103 115 Z"/>
    <path d="M 104.5 115 C 104.5 111.8 107 109 110 109 C 113 109 115.5 111.8 115.5 115 C 115.5 118.2 113 121 110 121 C 107 121 104.5 118.2 104.5 115 Z"
          fill="#f5ede0"/>

    <!-- M small cap -->
    <path d="M 120 108 L 120 122 L 121.5 122 L 121.5 110.5 L 125 118 L 128.5 110.5 L 128.5 122 L 130 122 L 130 108 L 128 108 L 125 115 L 122 108 Z"/>

    <!-- H small cap -->
    <path d="M 134 108 L 134 122 L 135.5 122 L 135.5 108 Z M 142.5 108 L 142.5 122 L 144 122 L 144 108 Z"/>
    <rect x="135.5" y="114.3" width="7" height="1.2" rx="0.6"/>

    <!-- U small cap -->
    <path d="M 148 108 L 148 116.5 C 148 120 150 122.5 153 122.5 C 156 122.5 158 120 158 116.5 L 158 108 L 156.5 108 L 156.5 116.5 C 156.5 119 155 121 153 121 C 151 121 149.5 119 149.5 116.5 L 149.5 108 Z"/>

    <!-- B small cap -->
    <path d="M 162 108 L 162 122 L 167 122 C 169.5 122 171.5 120.5 171.5 118.5 C 171.5 117 170.5 115.8 169 115.3 C 170.2 114.8 171 113.7 171 112.5 C 171 110.2 169 108 166 108 Z"/>
    <path d="M 163.5 109.3 L 163.5 114.5 L 166.5 114.5 C 168.5 114.5 169.5 113.5 169.5 112 C 169.5 110.5 168.5 109.3 166.5 109.3 Z M 163.5 115.8 L 163.5 120.7 L 167 120.7 C 169 120.7 170 119.7 170 118.3 C 170 116.9 169 115.8 167 115.8 Z"
          fill="#f5ede0"/>

    <!-- Thin centre rule between monogram and wordmark -->
    <rect x="115" y="92" width="90" height="0.6" rx="0.3" fill="#c9a96e" opacity="0.6"/>

    <!-- ══ BOTTOM DESCRIPTOR ══════════════════════════════════════
         Very small "ПЛАТФОРМА" or "PLATFORM" — at caption scale,
         to give cartouche the 'ateliye' feel of a stamp.           -->
    <!-- Simplified as a hairline rule only — let the cartouche breathe -->
  </g>

</svg>
