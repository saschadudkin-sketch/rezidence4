# nginx.conf.template — конфигурация nginx для Docker (dev / http).
#
# FIX [AUDIT]: этот файл является ШАБЛОНОМ — переменные вида $BACKEND_URL
# подставляются через envsubst при старте контейнера (docker-entrypoint.sh).
#
# ПРИЧИНА: nginx НЕ интерполирует переменные окружения в add_header без envsubst.
# Без этого в браузер приходит буквальная строка "${BACKEND_URL}" в CSP-заголовке,
# браузер блокирует загрузку фото и SSE-соединение с бэкендом.
#
# В Dockerfile этот файл копируется как /etc/nginx/nginx.conf.template
# и обрабатывается docker-entrypoint.sh перед стартом nginx.

# ─── Rate limiting ────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

# ─── HTTP сервер (dev / без SSL) ──────────────────────────────────────────────
# В production замените этот файл на nginx.prod.conf (с HTTPS).
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # FIX [AUDIT]: $BACKEND_URL заменяется envsubst — не ${BACKEND_URL} (nginx-синтаксис).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: $BACKEND_URL; connect-src 'self' $BACKEND_URL; worker-src 'self';" always;
    add_header Permissions-Policy "camera=(self), notifications=(self), geolocation=()" always;

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Uploads proxy ────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # ─── API proxy с rate limiting ────────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── Static assets cache ──────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
