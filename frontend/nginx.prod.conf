# nginx.prod.conf.template — Production config with HTTPS
#
# ВАЖНО: это ШАБЛОН — переменные вида $BACKEND_URL заменяет envsubst при старте контейнера.
# Переименуйте файл в nginx.prod.conf.template и настройте Dockerfile/entrypoint:
#
#   В Dockerfile добавьте entrypoint:
#     COPY docker-entrypoint.sh /docker-entrypoint.sh
#     RUN chmod +x /docker-entrypoint.sh
#     ENTRYPOINT ["/docker-entrypoint.sh"]
#
#   docker-entrypoint.sh:
#     #!/bin/sh
#     # Подставляем переменные окружения в nginx конфиг
#     envsubst '$BACKEND_URL $YOUR_DOMAIN' \
#       < /etc/nginx/nginx.conf.template \
#       > /etc/nginx/nginx.conf
#     exec nginx -g 'daemon off;'
#
# В docker-compose задайте:
#     environment:
#       BACKEND_URL: https://api.yourdomain.com
#       YOUR_DOMAIN: yourdomain.com
#
# ПРИЧИНА ИСПРАВЛЕНИЯ: nginx НЕ интерполирует переменные в add_header без envsubst.
# Без этого фикса браузер получает буквально "${BACKEND_URL}" в CSP-заголовке и
# блокирует загрузку фотографий с бэкенда (img-src, connect-src не совпадают).

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=3r/s;

# ─── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name $YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/$YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$YOUR_DOMAIN/privkey.pem;

    # Mozilla Intermediate TLS config (2024)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # S3: X-XSS-Protection removed — deprecated in modern browsers, ignored by Chrome/Firefox.
    # Protection is provided by CSP (Content-Security-Policy) below.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # FIX [AUDIT]: $BACKEND_URL заменяется envsubst при старте контейнера.
    # Ранее: ${BACKEND_URL} → nginx отдавал буквально "${BACKEND_URL}" → CSP блокировал фото.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: $BACKEND_URL; connect-src 'self' $BACKEND_URL; worker-src 'self';" always;
    add_header Permissions-Policy "camera=(self), notifications=(self), geolocation=()" always;

    # ─── SPA fallback ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Uploads proxy ────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
    }

    # ─── API proxy ────────────────────────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ─── Static assets cache ──────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Compression ──────────────────────────────────────────────────────────
    # Brotli включаем только в production-конфиг.
    # Модули приходят из Alpine-пакета nginx-mod-http-brotli, установленного в Dockerfile.
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1000;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
