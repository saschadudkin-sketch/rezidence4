name: Nightly Smoke

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  restore-drill-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root deps
        run: npm ci
      - name: Build synthetic latest backup set
        run: |
          mkdir -p /tmp/domhub-restore-drill-preflight
          for db in residenze platform zamoskv; do
            printf -- '-- synthetic pg_dump marker for %s\n' "$db" \
              | gzip > "/tmp/domhub-restore-drill-preflight/${db}_latest.sql.gz"
          done
      - name: Validate restore drill preflight gate
        env:
          BACKUP_DIR: /tmp/domhub-restore-drill-preflight
        run: npm run tenant:restore-drill:preflight -- --skip-docker --min-bytes 1 --max-age-hours 24

  playwright-nightly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install e2e deps
        run: npm ci
      - name: Prepare Playwright runtime deps + browser
        run: npm run test:e2e:preflight
      - name: Run smoke (schedule flow)
        id: nightly_smoke
        continue-on-error: true
        run: npm run test:e2e -- e2e/pass-flow.spec.js --project=chromium --workers=1 --retries=1
      - name: Summarize nightly smoke
        if: always()
        env:
          SUMMARY_TITLE: Phase 1 status — nightly-smoke
          SUMMARY_SCOPE: Playwright nightly smoke
          SUMMARY_OUTCOME: ${{ steps.nightly_smoke.outcome }}
          SUMMARY_SPEC: e2e/pass-flow.spec.js
          SUMMARY_PROJECT: chromium
          SUMMARY_COMMAND: npm run test:e2e -- e2e/pass-flow.spec.js --project=chromium --workers=1 --retries=1
          SUMMARY_ARTIFACT: playwright-nightly-report (on failure)
          SUMMARY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          scripts/ci/write_status_summary.sh
      - name: Fail nightly job if smoke failed
        if: steps.nightly_smoke.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-nightly-report
          path: playwright-report/
