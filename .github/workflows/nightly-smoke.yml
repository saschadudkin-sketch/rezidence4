name: Nightly Smoke

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  playwright-nightly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run smoke (schedule flow)
        run: npx playwright test e2e/pass-flow.spec.js --project=chromium --workers=1 --retries=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-nightly-report
          path: playwright-report/
