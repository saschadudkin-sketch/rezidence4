# FIX [AUDIT-2 #20, #27]: CI with E2E, Docker layer cache

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  alert-rules-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
      - name: Validate Prometheus rules
        run: promtool check rules ops/alerts/*.yml

  observability-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate alert rules ↔ docs/runbook consistency
        run: node ops/check_observability_consistency.js

  loadtest-scripts-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate k6 script syntax
        run: node --check loadtest/auth_resilience.js
      - name: Validate synthetic canary shell script syntax
        run: bash -n loadtest/synthetic_canary.sh

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run test:contract
      - run: npm run test:detect-open-handles

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build

  frontend-verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify:all

  frontend-prod-env-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build fails without VITE_API_URL
        run: |
          unset VITE_API_URL
          if npm run build; then
            echo "Expected production build to fail without VITE_API_URL"
            exit 1
          else
            echo "Build correctly failed without VITE_API_URL"
          fi
      - name: Production build passes with VITE_API_URL
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-test, frontend-test, frontend-verify-all, frontend-prod-env-guard, alert-rules-validate, observability-consistency, loadtest-scripts-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/package-lock.json', '**/Dockerfile') }}
      - run: docker compose build

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx playwright install chromium --with-deps
      - run: docker compose up -d
      - run: npx playwright test e2e/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  nightly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule'
    env:
      BASE_URL: http://localhost:3001
      SYNTHETIC_TOKEN: ${{ secrets.SYNTHETIC_TEST_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx playwright install chromium --with-deps
      - run: docker compose up -d
      - name: Synthetic canary (auth/chat/health)
        if: env.SYNTHETIC_TOKEN != ''
        run: ./loadtest/synthetic_canary.sh
        env:
          TOKEN: ${{ env.SYNTHETIC_TOKEN }}
          BASE_URL: ${{ env.BASE_URL }}
      - run: npx playwright test e2e/pass-flow.spec.js
