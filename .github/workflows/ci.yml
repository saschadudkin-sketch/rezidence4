# FIX [AUDIT-2 #20, #27]: CI with E2E, Docker layer cache

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  alert-rules-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
      - name: Validate Prometheus rules
        run: promtool check rules ops/alerts/*.yml

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run test:contract
      - run: npm run test:detect-open-handles

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: mkdir -p ../artifacts
      - run: npm run test:ux-critical:report
      - run: npm run build
      - name: Summarize UX-critical suite
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reportPath = 'artifacts/ux-critical-vitest.json';
          let summary = '## Phase 1 status — frontend-test\n';
          try {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const total = report.numTotalTests ?? 0;
            const passed = report.numPassedTests ?? 0;
            const failed = report.numFailedTests ?? 0;
            const skipped = report.numPendingTests ?? 0;
            const files = (report.testResults || []).length;
            summary += `- Scope: UX-critical Vitest suite\n`;
            summary += `- Files: **${files}**\n`;
            summary += `- Tests: **${passed} passed** / ${failed} failed / ${skipped} skipped (total ${total})\n`;
          } catch (err) {
            summary += `- Unable to read ${reportPath}: ${err.message}\n`;
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          }
          console.log(summary);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-critical-vitest-report
          path: artifacts/ux-critical-vitest.json

  frontend-verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify:all

  frontend-prod-env-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build fails without VITE_API_URL
        run: |
          unset VITE_API_URL
          if npm run build; then
            echo "Expected production build to fail without VITE_API_URL"
            exit 1
          else
            echo "Build correctly failed without VITE_API_URL"
          fi
      - name: Production build passes with VITE_API_URL
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-test, frontend-test, login-e2e-smoke, frontend-verify-all, frontend-prod-env-guard, alert-rules-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/package-lock.json', '**/Dockerfile') }}
      - run: docker compose build

  login-e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-test]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e:preflight
      - id: login_e2e
        run: npm run test:e2e -- e2e/login-flow.spec.js --project=chromium
      - name: Summarize login smoke
        if: always()
        run: |
          echo "## Phase 1 status — login-e2e-smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: Playwright login smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: **${{ steps.login_e2e.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Spec: \`e2e/login-flow.spec.js\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: \`chromium\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Command: \`npm run test:e2e -- e2e/login-flow.spec.js --project=chromium\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: login-smoke-playwright-report
          path: playwright-report/

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e:preflight
      - run: docker compose up -d
      - id: full_e2e
        continue-on-error: true
        run: npm run test:e2e -- e2e/
      - name: Summarize full e2e run
        if: always()
        run: |
          echo "## Phase 1 status — e2e-test" >> "$GITHUB_STEP_SUMMARY"
          echo "- Scope: Full Playwright e2e suite" >> "$GITHUB_STEP_SUMMARY"
          echo "- Outcome: **${{ steps.full_e2e.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Command: \`npm run test:e2e -- e2e/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`playwright-report\` (uploaded in this job)" >> "$GITHUB_STEP_SUMMARY"
      - name: Fail job if full e2e failed
        if: steps.full_e2e.outcome != 'success'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  nightly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e:preflight
      - run: docker compose up -d
      - run: npm run test:e2e -- e2e/pass-flow.spec.js --project=chromium
