# FIX [AUDIT-2 #20, #27]: CI with E2E, Docker layer cache

name: CI

on:
  push:
    branches: [main, platform-v1]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  alert-rules-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
      - name: Validate Prometheus rules
        run: promtool check rules ops/alerts/*.yml

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - name: Critical-path coverage
        run: npm run test:coverage:critical
      - run: npm run test:contract
      - run: npm run test:detect-open-handles

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3001
      VITE_RUNTIME_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `npm test` resolves to `vitest run` per package.json; the old
      # `--watchAll=false` was a Jest flag that Vitest's CAC parser rejects.
      - run: npm test
      - run: mkdir -p ../artifacts
      - run: npm run test:ux-critical:report
      - run: npm run build
      - name: Bundle size budget check (PERF-05)
        run: node scripts/check-bundle-size.js dist/assets
      - name: Summarize UX-critical suite
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reportPath = 'artifacts/ux-critical-vitest.json';
          let summary = '## Phase 1 status — frontend-test\n';
          try {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const total = report.numTotalTests ?? 0;
            const passed = report.numPassedTests ?? 0;
            const failed = report.numFailedTests ?? 0;
            const skipped = report.numPendingTests ?? 0;
            const files = (report.testResults || []).length;
            summary += `- Scope: UX-critical Vitest suite\n`;
            summary += `- Files: **${files}**\n`;
            summary += `- Tests: **${passed} passed** / ${failed} failed / ${skipped} skipped (total ${total})\n`;
          } catch (err) {
            summary += `- Unable to read ${reportPath}: ${err.message}\n`;
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          }
          console.log(summary);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-critical-vitest-report
          path: artifacts/ux-critical-vitest.json

  frontend-verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3001
      VITE_RUNTIME_MODE: live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify:all

  frontend-prod-env-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build fails without VITE_API_URL
        run: |
          unset VITE_API_URL
          if npm run build; then
            echo "Expected production build to fail without VITE_API_URL"
            exit 1
          else
            echo "Build correctly failed without VITE_API_URL"
          fi
      - name: Production build passes with VITE_API_URL
        env:
          VITE_API_URL: http://localhost:3001
          VITE_RUNTIME_MODE: live
        run: npm run build

  governance-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: OpenAPI mounted-route drift
        run: npm run openapi:drift
      - name: Frontend v1 contract coverage
        run: npm run frontend:v1-contract-coverage
      - name: Frontend v1 enum drift
        run: npm run frontend:v1-enum-drift
      - name: Generated OpenAPI types are fresh
        run: |
          npm run openapi:types
          git diff --exit-code -- frontend/src/api/generated/openapi.d.ts
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Install Semgrep
        run: |
          python -m pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Security scan
        run: npm run security:scan
      - name: Release gate metadata matrix
        run: npm run release:gate:metadata

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-test, frontend-test, login-e2e-smoke, frontend-verify-all, frontend-prod-env-guard, governance-gates, alert-rules-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/package-lock.json', '**/Dockerfile') }}
      # docker-compose.yml requires DB_PASSWORD, REDIS_PASSWORD, JWT_SECRET,
      # PLATFORM_JWT_SECRET, UPLOAD_SIGNING_SECRET, FRONTEND_URL для YAML
      # interpolation (security hardening — AUDIT #6/#7).  CI dummy creds
      # хранятся в ops/ci-dummy.env (checked in, не used in production).
      - run: docker compose --env-file ops/ci-dummy.env build

  login-e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-test]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Playwright webServer (см. playwright.config.js + scripts/run-playwright-webserver.cjs)
      # запускает Vite из frontend/node_modules/vite/bin/vite.js. Корневой `npm ci`
      # ставит только @playwright/test, поэтому frontend-deps надо доустановить
      # отдельно — иначе webServer падает с MODULE_NOT_FOUND до старта тестов.
      - name: Install frontend deps for Playwright webServer (Vite)
        working-directory: frontend
        run: npm ci
      - run: npm run test:e2e:preflight
      - id: login_e2e
        run: npm run test:e2e -- e2e/login-flow.spec.js --project=chromium
      - name: Summarize login smoke
        if: always()
        env:
          SUMMARY_TITLE: Phase 1 status — login-e2e-smoke
          SUMMARY_SCOPE: Playwright login smoke
          SUMMARY_OUTCOME: ${{ steps.login_e2e.outcome }}
          SUMMARY_SPEC: e2e/login-flow.spec.js
          SUMMARY_PROJECT: chromium
          SUMMARY_COMMAND: npm run test:e2e -- e2e/login-flow.spec.js --project=chromium
          SUMMARY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          scripts/ci/write_status_summary.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: login-smoke-playwright-report
          path: playwright-report/

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install frontend deps for Playwright webServer (Vite)
        working-directory: frontend
        run: npm ci
      - run: npm run test:e2e:preflight
      # ops/ci-dummy.env: CI-only fake creds.  --env-file решает interpolation
      # YAML, но docker-compose.yml имеет директиву `env_file: - .env` для
      # backend service (не override'ится через CLI).  Поэтому копируем тот
      # же файл как .env, чтобы compose не падал с "env file .env not found".
      - run: cp ops/ci-dummy.env .env
      - id: compose_up
        run: docker compose --env-file ops/ci-dummy.env up -d
      - id: seed_v1_access
        run: docker compose exec -T backend node src/e2e/seedV1Access.js
      - id: v1_access_e2e
        env:
          E2E_V1_ACCESS: "1"
          E2E_PROPERTY_SLUG: zamoskv
          JWT_SECRET: ci-dummy-jwt-secret-32chars-padding-ok
          PLAYWRIGHT_BASE_URL: http://127.0.0.1
          PLAYWRIGHT_SKIP_WEBSERVER: "1"
        run: npm run test:e2e -- e2e/v1-access-production.spec.js --project=chromium --reporter=list
      # Если compose up или последующие тесты упали — выгружаем логи db +
      # backend для диагностики strict gate.
      - name: Diagnose compose state on failure
        if: failure()
        run: |
          echo "::group::compose ps"
          docker compose ps -a || true
          echo "::endgroup::"
          echo "::group::db logs"
          docker compose logs db || true
          echo "::endgroup::"
          echo "::group::backend logs"
          docker compose logs backend || true
          echo "::endgroup::"
      - id: full_e2e
        run: npm run test:e2e -- e2e/
      - name: Summarize full e2e run
        if: always()
        env:
          SUMMARY_TITLE: Phase 1 status — e2e-test
          SUMMARY_SCOPE: Full Playwright e2e suite + v1 access production flow
          SUMMARY_OUTCOME: ${{ steps.full_e2e.outcome }}
          SUMMARY_COMMAND: npm run test:e2e -- e2e/
          SUMMARY_V1_ACCESS_OUTCOME: ${{ steps.v1_access_e2e.outcome }}
          SUMMARY_ARTIFACT: playwright-report
          SUMMARY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          scripts/ci/write_status_summary.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  phase1-gate-summary:
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'schedule'
    needs: [frontend-test, login-e2e-smoke, e2e-test]
    steps:
      - name: Phase 1 gate verdict
        env:
          FRONTEND_RESULT: ${{ needs.frontend-test.result }}
          LOGIN_SMOKE_RESULT: ${{ needs.login-e2e-smoke.result }}
          FULL_E2E_RESULT: ${{ needs.e2e-test.result }}
          RUN_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          RUN_URL="https://github.com/${RUN_REPOSITORY}/actions/runs/${RUN_ID}"
          RUN_TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          VERDICT='PASS'
          if [ "$FRONTEND_RESULT" != "success" ] || [ "$LOGIN_SMOKE_RESULT" != "success" ] || [ "$FULL_E2E_RESULT" != "success" ]; then
            VERDICT='FAIL'
          fi

          {
            echo "## Phase 1 gate verdict"
            echo "- Verdict: **$VERDICT**"
            echo "- frontend-test: \`$FRONTEND_RESULT\` (strict)"
            echo "- login-e2e-smoke: \`$LOGIN_SMOKE_RESULT\` (strict)"
            echo "- e2e-test: \`$FULL_E2E_RESULT\` (strict)"
            echo "- UX report artifact: \`ux-critical-vitest-report\`"
            echo "- Login smoke artifact (on failure): \`login-smoke-playwright-report\`"
            echo "- Full e2e artifact: \`playwright-report\`"
            echo "- Run page: $RUN_URL"
            echo "- Timestamp (UTC): \`$RUN_TS\`"
            echo "- Ref: \`$REF_NAME\`"
            echo "- Commit: \`$COMMIT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$VERDICT" != "PASS" ]; then
            exit 1
          fi

  nightly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # См. login-e2e-smoke: webServer Playwright всё равно поднимает Vite из
      # frontend/, даже если рядом крутится docker compose stack — `baseURL`
      # в playwright.config.js указывает на 127.0.0.1:3000 (Vite), а не на
      # nginx-контейнер.
      - name: Install frontend deps for Playwright webServer (Vite)
        working-directory: frontend
        run: npm ci
      - run: npm run test:e2e:preflight
      # ops/ci-dummy.env: см. e2e-test job — те же CI-only ephemeral creds.
      - run: cp ops/ci-dummy.env .env
      - run: docker compose --env-file ops/ci-dummy.env up -d
      - run: npm run test:e2e -- e2e/pass-flow.spec.js --project=chromium
