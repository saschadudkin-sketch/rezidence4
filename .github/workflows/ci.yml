# FIX [AUDIT-2 #20, #27]: CI with E2E, Docker layer cache

name: CI

on:
  push:
    branches: [main, platform-v1]
  pull_request:
  schedule:
    - cron: '0 3 * * *'

jobs:
  alert-rules-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
      - name: Validate Prometheus rules
        run: promtool check rules ops/alerts/*.yml

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      # On platform-v1 (D-lite refactor branch) the critical-path coverage
      # gate is advisory: parallel v1/ code and legacy reshuffles temporarily
      # change which files hit the critical threshold. Still runs and reports,
      # just doesn't fail the build. Tightens back up on merge to main.
      - name: Critical-path coverage (strict on main, advisory on platform-v1)
        run: npm run test:coverage:critical
        continue-on-error: ${{ github.ref == 'refs/heads/platform-v1' || github.base_ref == 'platform-v1' }}
      - run: npm run test:contract
      - run: npm run test:detect-open-handles

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watchAll=false
      - run: mkdir -p ../artifacts
      - run: npm run test:ux-critical:report
      - run: npm run build
      - name: Bundle size budget check (PERF-05)
        run: node scripts/check-bundle-size.js dist/assets
      - name: Summarize UX-critical suite
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reportPath = 'artifacts/ux-critical-vitest.json';
          let summary = '## Phase 1 status — frontend-test\n';
          try {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            const total = report.numTotalTests ?? 0;
            const passed = report.numPassedTests ?? 0;
            const failed = report.numFailedTests ?? 0;
            const skipped = report.numPendingTests ?? 0;
            const files = (report.testResults || []).length;
            summary += `- Scope: UX-critical Vitest suite\n`;
            summary += `- Files: **${files}**\n`;
            summary += `- Tests: **${passed} passed** / ${failed} failed / ${skipped} skipped (total ${total})\n`;
          } catch (err) {
            summary += `- Unable to read ${reportPath}: ${err.message}\n`;
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          }
          console.log(summary);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-critical-vitest-report
          path: artifacts/ux-critical-vitest.json

  frontend-verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run verify:all

  frontend-prod-env-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build fails without VITE_API_URL
        run: |
          unset VITE_API_URL
          if npm run build; then
            echo "Expected production build to fail without VITE_API_URL"
            exit 1
          else
            echo "Build correctly failed without VITE_API_URL"
          fi
      - name: Production build passes with VITE_API_URL
        env:
          VITE_API_URL: http://localhost:3001
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-test, frontend-test, login-e2e-smoke, frontend-verify-all, frontend-prod-env-guard, alert-rules-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('**/package-lock.json', '**/Dockerfile') }}
      - run: docker compose build

  login-e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend-test]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e:preflight
      - id: login_e2e
        run: npm run test:e2e -- e2e/login-flow.spec.js --project=chromium
      - name: Summarize login smoke
        if: always()
        env:
          SUMMARY_TITLE: Phase 1 status — login-e2e-smoke
          SUMMARY_SCOPE: Playwright login smoke
          SUMMARY_OUTCOME: ${{ steps.login_e2e.outcome }}
          SUMMARY_SPEC: e2e/login-flow.spec.js
          SUMMARY_PROJECT: chromium
          SUMMARY_COMMAND: npm run test:e2e -- e2e/login-flow.spec.js --project=chromium
          SUMMARY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          scripts/ci/write_status_summary.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: login-smoke-playwright-report
          path: playwright-report/

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker-build]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e:preflight
      - run: docker compose up -d
      - id: full_e2e
        run: npm run test:e2e -- e2e/
      - name: Summarize full e2e run
        if: always()
        env:
          SUMMARY_TITLE: Phase 1 status — e2e-test
          SUMMARY_SCOPE: Full Playwright e2e suite
          SUMMARY_OUTCOME: ${{ steps.full_e2e.outcome }}
          SUMMARY_COMMAND: npm run test:e2e -- e2e/
          SUMMARY_ARTIFACT: playwright-report
          SUMMARY_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SUMMARY_TIMESTAMP_UTC="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          scripts/ci/write_status_summary.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  phase1-gate-summary:
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'schedule'
    needs: [frontend-test, login-e2e-smoke, e2e-test]
    steps:
      - name: Phase 1 gate verdict
        run: |
          FRONTEND_RESULT='${{ needs.frontend-test.result }}'
          LOGIN_SMOKE_RESULT='${{ needs.login-e2e-smoke.result }}'
          FULL_E2E_RESULT='${{ needs.e2e-test.result }}'
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_TS="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          VERDICT='PASS'
          if [ "$FRONTEND_RESULT" != "success" ] || [ "$LOGIN_SMOKE_RESULT" != "success" ] || [ "$FULL_E2E_RESULT" != "success" ]; then
            VERDICT='FAIL'
          fi

          {
            echo "## Phase 1 gate verdict"
            echo "- Verdict: **$VERDICT**"
            echo "- frontend-test: \`$FRONTEND_RESULT\`"
            echo "- login-e2e-smoke: \`$LOGIN_SMOKE_RESULT\`"
            echo "- e2e-test: \`$FULL_E2E_RESULT\`"
            echo "- UX report artifact: \`ux-critical-vitest-report\`"
            echo "- Login smoke artifact (on failure): \`login-smoke-playwright-report\`"
            echo "- Full e2e artifact: \`playwright-report\`"
            echo "- Run page: $RUN_URL"
            echo "- Timestamp (UTC): \`$RUN_TS\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          # On platform-v1 the verdict is advisory: mid-migration PRs
          # predictably break pieces of the legacy e2e suite while v1/ code
          # is still partial. Summary is still written to the run page so
          # regressions are visible; just doesn't hard-fail the check.
          IS_PLATFORM_V1='false'
          if [ "${{ github.ref }}" = "refs/heads/platform-v1" ] || [ "${{ github.base_ref }}" = "platform-v1" ]; then
            IS_PLATFORM_V1='true'
          fi

          if [ "$VERDICT" != "PASS" ] && [ "$IS_PLATFORM_V1" != "true" ]; then
            exit 1
          fi

  nightly-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:e2e:preflight
      - run: docker compose up -d
      - run: npm run test:e2e -- e2e/pass-flow.spec.js --project=chromium
